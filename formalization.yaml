version: "v0.4"

project:
  name: "Inverse classification for innerly joint short zero-sum subsequences in C3^3"
  description: >-
    We formalize an exact positional inverse classification in the elementary
    abelian group C3^3. For a sequence of 24 nonzero elements, every pair of
    nonempty zero-sum subsequences of length at most three has intersection
    sum zero if and only if the original sequence, up to a permutation of
    all 24 positions, consists of three copies of eight distinct elements
    having no short nonempty zero sum. The two implications, including the
    positional intersection condition, are proved in Lean. The existing
    literature review did not locate the exact inverse classification, but
    historical novelty, priority and significance are not certified.
  authors:
    - "John Fairfax-Ball"
  responsible_maintainers:
    - "John Fairfax-Ball"
  license: "Apache-2.0"

