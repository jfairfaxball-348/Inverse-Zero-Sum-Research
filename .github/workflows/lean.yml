name: Lean formalization

concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "InverseZeroSum.lean"
      - "InverseZeroSum/**"
      - "scripts/check_authority.py"
      - "authoritative/**"
      - "sessions/S044/**"
      - "sessions/S045/**"
      - "sessions/S046/**"
      - "sessions/S047/**"
      - "sessions/S048/**"
      - "sessions/S049/**"
      - "sessions/S050/**"
      - ".github/workflows/lean.yml"
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "lakefile.toml"
      - "InverseZeroSum.lean"
      - "InverseZeroSum/**"
      - "scripts/check_authority.py"
      - "authoritative/**"
      - "sessions/S044/**"
      - "sessions/S045/**"
      - "sessions/S046/**"
      - "sessions/S047/**"
      - "sessions/S048/**"
      - "sessions/S049/**"
      - "sessions/S050/**"
      - ".github/workflows/lean.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: resolve pinned mathlib dependency
        run: lake update
      - name: show resolved dependency lock
        run: cat lake-manifest.json
      - name: obtain mathlib cache
        run: lake exe cache get
      - name: lake build
        run: lake build
      - name: forbidden Lean placeholders
        shell: bash
        run: |
          if grep -R -nE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' \
              --include='*.lean' InverseZeroSum.lean InverseZeroSum; then
            echo "Forbidden Lean placeholder found."
            exit 1
          fi
      - name: authority checker
        shell: bash
        run: |
          rm -rf .lake
          python scripts/check_authority.py
