name: Manuscript validation

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'scripts/check_paper.py'
      - 'authoritative/**'
      - 'sessions/S061/**'
      - 'sessions/S062/**'
      - 'scripts/prepare_arxiv_release.py'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/check_paper.py'
      - 'authoritative/**'
      - 'sessions/S061/**'
      - 'sessions/S062/**'
      - 'scripts/prepare_arxiv_release.py'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern
      - name: Exact examples and source checks
        run: python3 scripts/check_paper.py
      - name: Compile and check typesetting
        run: bash paper/build.sh
      - name: Rebuild deterministically
        shell: bash
        run: |
          sha256sum paper/main.pdf > /tmp/paper-before.sha256
          rm -rf paper/build
          bash paper/build.sh
          sha256sum --check /tmp/paper-before.sha256
      - name: Portable arXiv source and clean unpacked rebuild
        shell: bash
        run: |
          python3 scripts/prepare_arxiv_release.py
          sha256sum paper/release/arxiv-source.tar.gz > /tmp/arxiv-source-before.sha256
          python3 scripts/prepare_arxiv_release.py
          sha256sum --check /tmp/arxiv-source-before.sha256
      - name: Authority consistency
        run: python3 scripts/check_authority.py
      - name: Upload compiled manuscript and logs
        uses: actions/upload-artifact@v4
        with:
          name: S062-arxiv-release-${{ github.sha }}
          path: |
            paper/main.pdf
            paper/main.tex
            paper/arxiv-metadata.json
            paper/ARXIV_RELEASE.md
            paper/release/arxiv-source.tar.gz
            paper/release/preview.pdf
            paper/release/manifest.json
            paper/references.bib
            paper/build/main.bbl
            paper/build/main.log
            paper/build/main.blg
          if-no-files-found: error
